[build]
  publish = "public"

# ── Un solo indirizzo: i vecchi .netlify.app portano al dominio ──
# Senza queste regole il sito risponde anche da andrealisagarden.netlify.app
# e dal vecchio lisagarden.netlify.app: tre indirizzi con lo stesso contenuto.
# Valgono solo per questi host: le anteprime (deploy-preview-N--...) restano libere.
[[redirects]]
  from = "https://andrealisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://andrealisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://lisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://lisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

# ── Header di sicurezza (tutte le pagine) ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    Content-Security-Policy = "default-src 'none'; img-src 'self' data: https://kpwmjngzsgjniontminj.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https://kpwmjngzsgjniontminj.supabase.co; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# ── Caching: asset con hash/immutabili ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
