[build]
  publish = "public"

# ── Un solo indirizzo: i vecchi .netlify.app portano al dominio ──
# Senza queste regole il sito risponde anche da andrealisagarden.netlify.app
# e dal vecchio lisagarden.netlify.app: tre indirizzi con lo stesso contenuto.
# Valgono solo per questi host: le anteprime (deploy-preview-N--...) restano libere.
[[redirects]]
  from = "https://andrealisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://andrealisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://lisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://lisagarden.netlify.app/*"
  to = "https://andrealisagarden.it/:splat"
  status = 301
  force = true

# ── Header di sicurezza (tutte le pagine) ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# ── Caching: asset con hash/immutabili ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
